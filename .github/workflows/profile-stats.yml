name: Profile stats
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-stats.yml'
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require profile stats token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo 'PROFILE_STATS_TOKEN secret is not set — refusing to publish unverified stats.' >&2
            exit 1
          fi
      - run: npm test
      - run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
