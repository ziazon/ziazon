name: Monthly profile update
on:
  schedule:
    - cron: '17 12 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every step but publish nothing
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: profile-monthly
  cancel-in-progress: false

jobs:
  monthly:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require profile and Claude tokens
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo 'PROFILE_STATS_TOKEN secret is empty — refusing to publish.' >&2
            exit 1
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'CLAUDE_CODE_OAUTH_TOKEN secret is empty — refusing to publish.' >&2
            exit 1
          fi
      - run: npm test
      - run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Configure commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update profile
        run: node scripts/monthly-update.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
